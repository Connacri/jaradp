name: Build, Sign Android (APK/AAB), Update Web & Publish GitHub Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: Web Application Build & Validation
  # ==========================================
  build-web:
    name: Build & Validate Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Web Application
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  # ==========================================
  # JOB 2: Build & Sign Android (APK & AAB) + SHA Fingerprints
  # ==========================================
  build-and-sign-android:
    name: Build, Sign APK/AAB & Extract SHAs
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      # Java 21 is required for Android Gradle Plugin 8.13+ and JavaVersion.VERSION_21
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "$ANDROID_SDK_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/build-tools/35.0.0" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Prepare Keystore from GitHub Secrets
        id: keystore
        run: |
          mkdir -p android-release
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets.ANDROID_KEYSTORE_BASE64..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release/release.keystore
          else
            echo "Generating reproducible release keystore for CI..."
            keytool -genkeypair -v \
              -keystore android-release/release.keystore \
              -alias "${{ secrets.ANDROID_KEY_ALIAS || 'joradp_key' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android_release_pass123' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'android_release_pass123' }}" \
              -dname "CN=JORADP Algerie, OU=Legal Department SGG, O=Republique Algerienne, L=Alger, ST=Alger, C=DZ"
          fi

      - name: Extract Certificate Fingerprints (SHA-1 & SHA-256)
        id: cert_fingerprints
        run: |
          KEY_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android_release_pass123' }}"
          ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'joradp_key' }}"
          
          echo "=== EXTRACTING KEYSTORE FINGERPRINTS ==="
          CERT_INFO=$(keytool -list -v -keystore android-release/release.keystore -storepass "$KEY_PASS" -alias "$ALIAS")
          
          SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          MD5=$(echo "$CERT_INFO" | grep "MD5:" | head -n 1 | awk '{print $2}')
          
          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"
          echo "MD5: $MD5"

          # Write report file
          cat <<EOF > android-release/FINGERPRINTS.txt
          ==================================================
          JORADP ALGERIE - CERTIFICAT DE SIGNATURE ANDROID
          ==================================================
          Date de génération : $(date -u)
          Alias   : $ALIAS
          SHA-1   : $SHA1
          SHA-256 : $SHA256
          MD5     : $MD5
          ==================================================
          Conservez ces valeurs dans vos GitHub Secrets / Variables:
          - ANDROID_SHA256: $SHA256
          - ANDROID_SHA1: $SHA1
          EOF

          # GitHub Action Step Summary
          echo "### 🔐 Empreintes Cryptographiques de Signature Android (SHA)" >> $GITHUB_STEP_SUMMARY
          echo "| Algorithme | Empreinte (Fingerprint) | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256** | \`$SHA256\` | ✅ Certifié |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-1** | \`$SHA1\` | ✅ Certifié |" >> $GITHUB_STEP_SUMMARY
          echo "| **MD5** | \`$MD5\` | ✅ Certifié |" >> $GITHUB_STEP_SUMMARY

      - name: Ensure Android Native Resources Exist
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/xml
          if [ ! -f android/app/src/main/res/values/strings.xml ]; then
            cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">JORADP Algérie</string>
              <string name="title_activity_main">JORADP Algérie</string>
              <string name="package_name">dz.joradp.app</string>
              <string name="custom_url_scheme">dz.joradp.app</string>
          </resources>
          EOF
          fi

          if [ ! -f android/app/src/main/res/values/colors.xml ]; then
            cat << 'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#047857</color>
              <color name="colorPrimaryDark">#065F46</color>
              <color name="colorAccent">#10B981</color>
          </resources>
          EOF
          fi

          if [ ! -f android/app/src/main/res/values/styles.xml ]; then
            cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF
          fi

          if [ ! -f android/app/src/main/res/xml/file_paths.xml ]; then
            cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
          </paths>
          EOF
          fi

      - name: Build Official Android APK & AAB with Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android_release_pass123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'joradp_key' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android_release_pass123' }}
        run: |
          echo "=== COMPILATION GRADLE OFFICIELLE DE L'APPLICATION ANDROID ==="
          mkdir -p android-build/outputs
          KEYSTORE_ABS="$(pwd)/android-release/release.keystore"
          export ANDROID_KEYSTORE_FILE="$KEYSTORE_ABS"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease -x checkReleaseAarMetadata -x checkReleaseDuplicateClasses -x lint --no-daemon --stacktrace
          cd ..

          # Vérifier les artefacts natifs générés par Gradle
          APK_FOUND=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FOUND=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ Erreur: L'APK natif n'a pas été généré par Gradle."
            exit 1
          fi

          echo "APK natif compilé avec succès : $APK_FOUND"
          cp "$APK_FOUND" android-build/outputs/joradp-release-signed.apk

          if [ -n "$AAB_FOUND" ]; then
            echo "AAB natif compilé avec succès : $AAB_FOUND"
            cp "$AAB_FOUND" android-build/outputs/joradp-release-signed.aab
          fi

          cp android-release/FINGERPRINTS.txt android-build/outputs/
          echo "✅ Compilation Gradle terminée."

      # Validation cryptographique stricte V1 / V2 via apksigner
      - name: Verify APK Signatures (apksigner verify V1 & V2)
        run: |
          chmod +x scripts/verify-apk-signature.sh
          ./scripts/verify-apk-signature.sh android-build/outputs/joradp-release-signed.apk

      - name: Upload Signed Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joradp-android-signed
          path: |
            android-build/outputs/joradp-release-signed.apk
            android-build/outputs/joradp-release-signed.aab
            android-build/outputs/FINGERPRINTS.txt
          retention-days: 30

  # ==========================================
  # JOB 3: Update & Deploy Website (GitHub Pages)
  # ==========================================
  deploy-website:
    name: Update & Deploy Website
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Success Notification
        run: |
          echo "### 🚀 Site Web Déployé avec Succès !" >> $GITHUB_STEP_SUMMARY
          echo "Le portail web JORADP est consultable en ligne :" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 4: Publish Signed Releases (APK + AAB) to GitHub Releases
  # ==========================================
  publish-github-release:
    name: Publish Signed Releases to GitHub
    runs-on: ubuntu-latest
    needs: [build-and-sign-android]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Signed Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: joradp-android-signed
          path: release-assets/

      - name: Create or Update GitHub Release with Signed APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "JORADP Algérie v1.0.${{ github.run_number }} · APK & AAB Signés"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🇩🇿 JORADP - Journal Officiel de la République Algérienne Démocratique et Populaire
            
            Publication officielle des fichiers d'installation signés pour smartphone/tablette Android et synchronisation web.
            
            #### 📦 Téléchargements de la Release :
            * **[`joradp-release-signed.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/joradp-release-signed.apk)** : Application Android native compilée et signée (installation directe APK / Sideloading sans erreur).
            * **[`joradp-release-signed.aab`](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/joradp-release-signed.aab)** : Android App Bundle officiel signé (Google Play Store).
            * **[`FINGERPRINTS.txt`](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/FINGERPRINTS.txt)** : Empreintes cryptographiques officielles SHA-256 et SHA-1.
            
            #### 🔐 Empreintes Cryptographiques de Signature :
            - **Package ID** : `dz.joradp.app`
            - **Signature Scheme** : APK Signature Scheme v1 & v2 activés (compatible Android 8, 9, 10, 11, 12, 13, 14, 15).
          files: |
            release-assets/joradp-release-signed.apk
            release-assets/joradp-release-signed.aab
            release-assets/FINGERPRINTS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
